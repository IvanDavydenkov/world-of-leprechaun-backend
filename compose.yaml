services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      USERS_MONGO_PASSWORD: ${USERS_MONGO_PASSWORD:?Set USERS_MONGO_PASSWORD in .env}
      VPN_CONFIGS_MONGO_PASSWORD: ${VPN_CONFIGS_MONGO_PASSWORD:?Set VPN_CONFIGS_MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongodb/init.js:/docker-entrypoint-initdb.d/01-users.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  users:
    build: ./services/users
    environment:
      USERS_HTTP_ADDR: :8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      VPN_API_URL: http://vpn-configs:8081
      MONGO_URI: mongodb://users_service:${USERS_MONGO_PASSWORD:?Set USERS_MONGO_PASSWORD}@mongodb:27017/users?authSource=users
      MONGO_DATABASE: users
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      ADMIN_YANDEX_ID: ${ADMIN_YANDEX_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URL: ${YANDEX_REDIRECT_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:-}
      AUTH_LOGOUT_REDIRECT_URL: ${AUTH_LOGOUT_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
  vpn-configs:
    build: ./services/vpn-configs
    environment:
      VPN_CONFIGS_HTTP_ADDR: :8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      USERS_API_URL: http://users:8080
      MONGO_URI: mongodb://vpn_configs_service:${VPN_CONFIGS_MONGO_PASSWORD:?Set VPN_CONFIGS_MONGO_PASSWORD}@mongodb:27017/vpn_configs?authSource=vpn_configs
      MONGO_DATABASE: vpn_configs
      VPN_HOST_ADDRESS: ${VPN_HOST_ADDRESS:-}
      VPN_HOST_USERNAME: ${VPN_HOST_USERNAME:-}
      VPN_HOST_PASSWORD: ${VPN_HOST_PASSWORD:-}
      VPN_CONFIG_ENCRYPTION_KEY: ${VPN_CONFIG_ENCRYPTION_KEY:-}
      VPN_KNOWN_HOSTS_FILE: ${VPN_KNOWN_HOSTS_FILE:-}
      VPN_PUBLIC_ENDPOINT: ${VPN_PUBLIC_ENDPOINT:-}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
