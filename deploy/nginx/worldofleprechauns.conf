# Host Nginx. Frontend container listens only on 127.0.0.1:8082.
# Obtain a certificate covering BOTH names before enabling HTTPS blocks.
server {
    listen 80;
    server_name worldofleprechauns.ru api.worldofleprechauns.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name worldofleprechauns.ru;
    ssl_certificate /etc/letsencrypt/live/worldofleprechauns.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldofleprechauns.ru/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name api.worldofleprechauns.ru;
    ssl_certificate /etc/letsencrypt/live/worldofleprechauns.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldofleprechauns.ru/privkey.pem;
    client_max_body_size 64k;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }
}